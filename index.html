x}.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:12px;color:#677b7c}.toolbar button{background:none;border:0;color:#205b63;font-weight:700}.empty{text-align:center;color:#657777;padding:30px}footer{padding:12px;color:#697b79;font-size:11px;text-align:center} </style>
<header><div class="top"><div><h1>IFPA · Sanwa Visits</h1><small>Orlando · Oct 2026 · Booth-order tracker</small></div><div class="progress" id="progress">0 / 0 met</div></div><div class="bar"><span id="bar"></span></div></header><main><div class="filters" id="filters"></div><input class="search" id="search" placeholder="Search supplier or booth…"><div class="toolbar"><span id="count"></span><button id="export">Copy follow-ups</button></div><div id="list"></div><footer>Booths from IFPA's Oct 14 exhibitor PDF. ? = not confirmed under this name. Entries save on this device/browser. Booth ranges are a walking-order approximation, not a verified aisle route.</footer></main><script>
const data=[{"name": "Taylor Farms", "booth": "1743", "owner": "Chao"}, {"name": "Muzzi Farms", "booth": "1583", "owner": "Chao"}, {"name": "Green Life Farms", "booth": "817", "owner": "Chao"}, {"name": "Tanimura & Antle", "booth": "2659", "owner": "Chao"}, {"name": "Ocean Mist", "booth": "1353", "owner": "Chao"}, {"name": "Beachside", "booth": "2589", "owner": "Chao"}, {"name": "Coastline", "booth": "2073", "owner": "Chao"}, {"name": "Pacific / Dynasty / PIM", "booth": "?", "owner": "Chao"}, {"name": "Church Brothers", "booth": "2079", "owner": "Chao"}, {"name": "Green Day Produce", "booth": "?", "owner": "Chao"}, {"name": "Long Produce / CTD", "booth": "?", "owner": "Chao"}, {"name": "Lucky Produce", "booth": "?", "owner": "Chao"}, {"name": "Sunkist", "booth": "2443", "owner": "Chao"}, {"name": "Veg-Fresh Farms", "booth": "?", "owner": "Chao"}, {"name": "Potandon", "booth": "3855", "owner": "Chao"}, {"name": "Sun Pacific", "booth": "3687", "owner": "Chao"}, {"name": "Tocumen", "booth": "1107", "owner": "Chao"}, {"name": "AYCO", "booth": "1319", "owner": "Chao"}, {"name": "Sol Group", "booth": "?", "owner": "Chao"}, {"name": "Classic Fruit", "booth": "?", "owner": "Chao"}, {"name": "Little Leaf Farms", "booth": "609", "owner": "Chao"}, {"name": "Simply Fresh", "booth": "251", "owner": "Chao"}, {"name": "Sun Lovin Foods", "booth": "1201", "owner": "Chao"}, {"name": "Sunswell Greens", "booth": "919", "owner": "Chao"}, {"name": "Southern Specialties", "booth": "1121", "owner": "Laura"}, {"name": "Altar Produce", "booth": "2771", "owner": "Laura"}, {"name": "Ecoripe Tropicals", "booth": "930", "owner": "Laura"}, {"name": "Organzo", "booth": "?", "owner": "Laura"}, {"name": "Yu An", "booth": "?", "owner": "Laura"}, {"name": "Double Green", "booth": "4063", "owner": "Laura"}, {"name": "Vega Produce", "booth": "1879", "owner": "Laura"}, {"name": "Rock Garden", "booth": "?", "owner": "Laura"}, {"name": "From the South", "booth": "?", "owner": "Laura"}, {"name": "M&M", "booth": "?", "owner": "Laura"}, {"name": "Sunrise", "booth": "?", "owner": "Laura"}, {"name": "Driscoll's", "booth": "1470", "owner": "Yasmin"}, {"name": "Wish Farms", "booth": "825", "owner": "Yasmin"}, {"name": "California Giant", "booth": "2743", "owner": "Yasmin"}, {"name": "CBS", "booth": "?", "owner": "Yasmin"}, {"name": "Mucci / Cox Farms", "booth": "1243", "owner": "Yasmin"}, {"name": "Great Lakes Greenhouses", "booth": "159", "owner": "Yasmin"}, {"name": "Nature Fresh", "booth": "2642", "owner": "Yasmin"}, {"name": "Sunset / Mastronardi", "booth": "3743", "owner": "Yasmin"}, {"name": "Always Fresh", "booth": "1215", "owner": "Yasmin"}, {"name": "Myrick Produce", "booth": "1178", "owner": "Yasmin"}, {"name": "Yates", "booth": "?", "owner": "Yasmin"}, {"name": "Pacific Shores", "booth": "?", "owner": "Bea"}, {"name": "Mack Farms", "booth": "1013", "owner": "Bea"}, {"name": "Chelan Fresh", "booth": "1157", "owner": "Bea"}, {"name": "Riveridge", "booth": "4071", "owner": "Bea"}, {"name": "Burch Farms", "booth": "3177", "owner": "Bea"}, {"name": "XO Produce", "booth": "?", "owner": "Bea"}, {"name": "Sweet Seasons", "booth": "3271", "owner": "Bea"}, {"name": "Seminole Produce", "booth": "?", "owner": "Bea"}, {"name": "Noble Citrus", "booth": "600", "owner": "Bea"}, {"name": "Cabbage Inc.", "booth": "?", "owner": "Bea"}, {"name": "Lemons — primary program", "booth": "?", "owner": "Sourcing"}, {"name": "Mexico Chinese veg — grower referrals", "booth": "?", "owner": "Sourcing"}];

let owner='All',query='';const $=id=>document.getElementById(id);const key=(i,f)=>'ifpa26:'+i+':'+f;const get=(i,f)=>localStorage.getItem(key(i,f))||'';const safe=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function group(b){let n=parseInt(b);return Number.isFinite(n)?`${Math.floor(n/1000)*1000}–${Math.floor(n/1000)*1000+999}`:'Booth to confirm'}function render(){const owners=['All','Chao','Laura','Yasmin','Bea','Sourcing'];$('filters').innerHTML=owners.map(x=>`<button class="${x===owner?'active':''}" data-owner="${x}">${x}</button>`).join('');let arr=data.map((d,i)=>({...d,i})).filter(d=>(owner==='All'||d.owner===owner)&&(d.name+' '+d.booth).toLowerCase().includes(query));arr.sort((a,b)=>(a.booth==='?')-(b.booth==='?')||(parseInt(a.booth)||99999)-(parseInt(b.booth)||99999));$('count').textContent=`${arr.length} visits · ${arr.filter(d=>d.booth==='?').length} booths to confirm`;let allMet=data.filter((d,i)=>get(i,'met')==='1').length;$('progress').textContent=`${allMet} / ${data.length} met`;$('bar').style.width=100*allMet/data.length+'%';let current='',out='';for(const d of arr){let g=group(d.booth);if(g!==current){current=g;out+=`<h2>${g}</h2>`}out+=`<article class="item ${get(d.i,'met')==='1'?'done':''}"><div class="line"><div><div class="name">${safe(d.name)}</div><div class="meta">${safe(d.owner)}</div>${purposes[d.name]?`<div class="purpose">${safe(purposes[d.name])}</div>`:""}</div><div class="booth">${d.booth==='?'?'Booth ?':'#'+safe(d.booth)}</div></div><div class="checks">${[['met','✓ Met'],['opp','★ Opportunity'],['follow','↗ Follow-up']].map(([k,label])=>`<label><input type="checkbox" data-i="${d.i}" data-f="${k}" ${get(d.i,k)==='1'?'checked':''}>${label}</label>`).join('')}</div><textarea class="note" rows="1" data-i="${d.i}" placeholder="Quick note / contact / next step…">${safe(get(d.i,'note'))}</textarea></article>`}$('list').innerHTML=out||'<div class="empty">No matches</div>'}
$('filters').addEventListener('click',e=>{let b=e.target.closest('button');if(b){owner=b.dataset.owner;render()}});$('search').addEventListener('input',e=>{query=e.target.value.toLowerCase();render()});$('list').addEventListener('change',e=>{let x=e.target;if(x.matches('input[type=checkbox]')){localStorage.setItem(key(x.dataset.i,x.dataset.f),x.checked?'1':'0');render()}});$('list').addEventListener('input',e=>{let x=e.target;if(x.matches('textarea'))localStorage.setItem(key(x.dataset.i,'note'),x.value)});$('export').addEventListener('click',()=>{let s=data.map((d,i)=>({d,i})).filter(({i})=>get(i,'follow')==='1').map(({d,i})=>`${d.owner} · ${d.name} (#${d.booth}): ${get(i,'note')||'Follow up'}`).join('\n');(navigator.clipboard && window.isSecureContext ? navigator.clipboard.writeText(s||'No follow-ups marked yet').then(()=>alert('Follow-ups copied')).catch(()=>prompt('Copy follow-ups:',s)) : prompt('Copy follow-ups:',s||'No follow-ups marked yet'))});render();
</script></html>
